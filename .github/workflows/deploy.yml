name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Student Panel (Avto-maktab)
        run: |
          cd Avto-maktab
          rm -f package-lock.json
          npm install
          npm run build

      - name: Build Admin Panel (admin/frontend)
        run: |
          cd admin/frontend
          rm -f package-lock.json
          npm install
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Install Composer Dependencies (admin/backend)
        run: |
          cd admin/backend
          composer install --optimize-autoloader --no-dev --no-progress --no-interaction

      - name: Deploy Student Panel to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: Avto-maktab/dist/
          dangerous-clean-slate: false

      - name: Deploy Admin Panel to public_html/admin/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/admin/
          local-dir: admin/frontend/dist/
          dangerous-clean-slate: false

      - name: Deploy Backend to /application/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: application/
          local-dir: admin/backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.idea/**
            **/*.log
