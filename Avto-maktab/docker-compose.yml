version: '3.8'

services:
  student-web-client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost/api
    command: npm run dev -- --host --port 5175
